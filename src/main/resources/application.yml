spring:
  application:
    name: cid-rag-poc
  config:
    import: "optional:file:.env[.properties]"



  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT}/${POSTGRES_DB:ragpoc}
    username: ${POSTGRES_USER:ragpoc}
    password: ${POSTGRES_PASSWORD:ragpoc}
    hikari:
      maximum-pool-size: 12

  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  ai:
    # Which ChatModel autoconfiguration is active. Changing provider is a pom
    # dependency plus this value; no application code names a provider.
    model:
      chat: ${RAG_CHAT_PROVIDER:deepseek}
    deepseek:
      # A placeholder keeps the application bootable without a key, matching the
      # lazy-model policy elsewhere. The first question then fails with a 401
      # that ChatService turns into "set DEEPSEEK_API_KEY": better than refusing
      # to start a deployment that only browses documents.
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          # Grounded answers: low temperature, bounded length.
          temperature: 0.1
          max-tokens: 1024

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
      # Required by MultipartConfig: reuse the multipart request that
      # MultipartFilter already parsed instead of re-reading a consumed stream.
      resolve-lazily: true

gg:
  jte:
    development-mode: true
    template-suffix: .jte
    use-precompiled-templates: false

# -----------------------------------------------------------------------------
# Application tuning knobs. Thresholds are starting points, not calibrated
# values; the evaluation step sweeps them against a golden set.
# -----------------------------------------------------------------------------
rag:
  embedding:
    # Provider seam: `transformers` today, a hosted service later.
    provider: ${RAG_EMBEDDING_PROVIDER:transformers}
    model-id: all-MiniLM-L6-v2
    # Changing the dimension requires re-indexing into a fresh collection.
    dimension: 384
    transformers:
      model-path: ${RAG_EMBEDDING_MODEL_PATH:models/all-MiniLM-L6-v2/model.onnx}
      tokenizer-path: ${RAG_EMBEDDING_TOKENIZER_PATH:models/all-MiniLM-L6-v2/tokenizer.json}
      # Optimum exports this sentence-transformers repo with a token-level
      # `token_embeddings` output ([batch, seq, hidden]); Spring AI mean-pools it.
      output-name: token_embeddings
      # all-MiniLM-L6-v2 is trained for a 256-token window.
      max-sequence-length: 256

  rerank:
    # Provider seam: `onnx` (local cross-encoder) or `none`.
    provider: ${RAG_RERANK_PROVIDER:onnx}
    top-n: 6
    # When a hosted reranker fails, degrade to dense order instead of refusing.
    fail-open: false
    onnx:
      model-path: ${RAG_RERANK_MODEL_PATH:models/ms-marco-MiniLM-L-6-v2/model.onnx}
      tokenizer-path: ${RAG_RERANK_TOKENIZER_PATH:models/ms-marco-MiniLM-L-6-v2/tokenizer.json}
      max-sequence-length: 512
      batch-size: 16
      # Thresholds are in this provider's own scale (raw logits) and must be
      # recalibrated when the provider changes. Uncalibrated starting points.
      min-relevance: 0.35
      min-chunk-relevance: 0.15

  qdrant:
    host: ${QDRANT_HOST:localhost}
    # gRPC port, not the HTTP one.
    port: ${QDRANT_GRPC_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    collection: ${RAG_QDRANT_COLLECTION:chunks}
    use-tls: ${QDRANT_USE_TLS:false}
    timeout-ms: 30000

  ingestion:
    max-file-bytes: 52428800
    formatter:
      # Tika's own trimming stays off; the cleaner owns boilerplate removal.
      left-alignment: false
      delete-top-lines: 0
      delete-bottom-lines: 0

  storage:
    local-root: ${RAG_STORAGE_ROOT:data/files}

  chunking:
    # Sized for the embedding model's 256-token window: the embedded text is
    # doc_title + section_title + chunk, so the chunk must leave room.
    target-tokens: 160
    max-tokens: 200
    min-tokens: 32
    overlap-percent: 12

  retrieval:
    dense-candidates: 30
    context-token-budget: 4000

  guard:
    max-question-chars: 2000
    requests-per-minute-per-user: 30

logging:
  level:
    com.example.ragpoc: INFO
