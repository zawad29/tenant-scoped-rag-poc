spring:
  application:
    name: cid-rag-poc
  config:
    import: "optional:file:.env[.properties]"



  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT}/${POSTGRES_DB:ragpoc}
    username: ${POSTGRES_USER:ragpoc}
    password: ${POSTGRES_PASSWORD:ragpoc}
    hikari:
      maximum-pool-size: 12

  jpa:
    # Flyway owns the schema; Hibernate only checks that the entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
      # Required by MultipartConfig: reuse the multipart request that
      # MultipartFilter already parsed instead of re-reading a consumed stream.
      resolve-lazily: true

gg:
  jte:
    development-mode: true
    template-suffix: .jte
    use-precompiled-templates: false

# -----------------------------------------------------------------------------
# Application tuning knobs. Thresholds are starting points, not calibrated
# values; the evaluation step sweeps them against a golden set.
# -----------------------------------------------------------------------------
rag:
  embedding:
    model-id: bge-base-en-v1.5
    model-path: ${RAG_EMBEDDING_MODEL_PATH:models/bge-base-en-v1.5/model.onnx}
    tokenizer-path: ${RAG_EMBEDDING_TOKENIZER_PATH:models/bge-base-en-v1.5/tokenizer.json}
    # bge uses CLS pooling; mean pooling silently degrades retrieval.
    pooling: CLS
    normalize: true
    dimension: 768
    max-sequence-length: 512
    batch-size: 16

  rerank:
    # Disabling it falls back to dense ordering without an absolute gate.
    enabled: true
    model-id: ms-marco-MiniLM-L-6-v2
    model-path: ${RAG_RERANK_MODEL_PATH:models/ms-marco-MiniLM-L-6-v2/model.onnx}
    tokenizer-path: ${RAG_RERANK_TOKENIZER_PATH:models/ms-marco-MiniLM-L-6-v2/tokenizer.json}
    max-sequence-length: 512
    batch-size: 16

  qdrant:
    host: ${QDRANT_HOST:localhost}
    # gRPC port, not the HTTP one.
    port: ${QDRANT_GRPC_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    collection: ${RAG_QDRANT_COLLECTION:chunks}
    use-tls: ${QDRANT_USE_TLS:false}
    timeout-ms: 30000

  ingestion:
    max-file-bytes: 52428800
    max-pages: 500

  storage:
    local-root: ${RAG_STORAGE_ROOT:data/files}

  chunking:
    # Capped by bge's 512-token limit: the embedded text is
    # doc_title + section_title + chunk, so the chunk itself must leave room.
    target-tokens: 400
    max-tokens: 480
    min-tokens: 48
    overlap-percent: 12

  retrieval:
    dense-candidates: 30
    rerank-top-n: 6
    # Calibrated on the golden set in the evaluation step; these only exist so
    # the gate has something to compare against.
    min-relevance: 0.35
    min-chunk-relevance: 0.15
    context-token-budget: 6000

  guard:
    max-question-chars: 2000
    requests-per-minute-per-user: 30

logging:
  level:
    com.example.ragpoc: INFO
