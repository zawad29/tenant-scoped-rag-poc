# CID-scoped RAG Chatbot PoC — Docker Compose
#
# Only data services run here; the Spring Boot app runs on the host.
#
#   docker compose --env-file .env up -d
#
# The services also declare `env_file: .env` (optional) so the values are
# injected into the containers. Compose's implicit `.env` lookup only feeds
# `${...}` interpolation and can be missed when running from another directory;
# `--env-file` above makes it explicit.
#
# Postgres holds structured data (cid, users, documents, versions, audit).
# Qdrant holds the chunk vectors and their payload text.

services:
  postgres:
    image: postgres:17
    container_name: cidrag-postgres
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragpoc}
      POSTGRES_USER: ${POSTGRES_USER:-ragpoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpoc}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      # 5433 on the host: this machine runs a native PostgreSQL on 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragpoc} -d ${POSTGRES_DB:-ragpoc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cidrag-qdrant
    env_file:
      - path: .env
        required: false
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
